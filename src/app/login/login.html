<div class="login-container">

  <div class="login-card">

    <h2>Login</h2>

    <p>
      Login to your Campus Hostel Allocation account.
    </p>


    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          [(ngModel)]="email"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          required>

      </div>


      <button
        type="submit"
        class="login-button">

        Login

      </button>

    </form>


   <div class="login-links">

      <p>
        Don't have an account?

        <button
          type="button"
          class="link-button"
          (click)="showRegister()">

          Create an account

        </button>

      </p>


      <button
        type="button"
        class="link-button"
        (click)="showForgotPasswordPage()">

        Forgot Password?

      </button>

    </div>

  </div>

</div>


@if (showForgotPassword) {

  <app-forgot-password
    (resetPasswordClicked)="showResetPasswordPage()">
  </app-forgot-password>

}


@if (showResetPassword) {

  <app-reset-password></app-reset-password>

}
